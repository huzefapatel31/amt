<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbit Airpodes Prime 701 ANC – 3D box</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage"><div id="box">
<div class="f front"><img alt="Front" src="front.jpg"></div>
<div class="f back"><img alt="Back" src="back.jpg"></div>
<div class="f right"><img alt="Right" src="right.jpg"></div>
<div class="f left"><img alt="Left" src="left.jpg"></div>
<div class="f top"><img alt="Top" src="top.jpg"></div>
<div class="f bottom"><img alt="Bottom" src="bottom.jpg"></div>
</div></div>
<div id="hud"><b>Orbit Airpodes Prime 701 ANC</b><span>8 × 12 × 3 in · drag to rotate, pinch or scroll to zoom</span></div>
<div id="bar" role="toolbar" aria-label="Views">
<button data-v="front">Front</button><button data-v="back">Back</button><button data-v="left">Left</button><button data-v="right">Right</button><button data-v="top">Top</button><button data-v="bottom">Bottom</button><button id="spin" class="on">Auto-spin</button>
</div>
<script src="script.js"></script>
</body>
</html>
