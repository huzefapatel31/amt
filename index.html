<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbit Airpodes Prime 701 ANC – 3D box</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--s:30px;--bg1:#f3f1ee;--bg2:#d9d5d0;--ink:#26211f;--chip:rgba(255,255,255,.78);--chip-on:#8e1522;--line:rgba(0,0,0,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b2827;--bg2:#141211;--ink:#eee8e4;--chip:rgba(255,255,255,.1);--chip-on:#c3283a;--line:rgba(255,255,255,.18)}}
:root[data-theme="dark"]{--bg1:#2b2827;--bg2:#141211;--ink:#eee8e4;--chip:rgba(255,255,255,.1);--chip-on:#c3283a;--line:rgba(255,255,255,.18)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 38%,var(--bg1),var(--bg2));color:var(--ink);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab;perspective:calc(var(--s)*70);perspective-origin:50% 50%;display:flex;align-items:center;justify-content:center}
#stage:active{cursor:grabbing}
#box{position:relative;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.f{position:absolute;left:0;top:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#5a0f18}
.f img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
/* W=8 H=12 D=3 (inches) ; --s = px per inch */
.front,.back{width:calc(var(--s)*8);height:calc(var(--s)*12);margin:calc(var(--s)*-6) 0 0 calc(var(--s)*-4)}
.left,.right{width:calc(var(--s)*3);height:calc(var(--s)*12);margin:calc(var(--s)*-6) 0 0 calc(var(--s)*-1.5)}
.top,.bottom{width:calc(var(--s)*8);height:calc(var(--s)*3);margin:calc(var(--s)*-1.5) 0 0 calc(var(--s)*-4)}
.front{transform:translateZ(calc(var(--s)*1.5))}
.back{transform:rotateY(180deg) translateZ(calc(var(--s)*1.5));filter:brightness(.88)}
.right{transform:rotateY(90deg) translateZ(calc(var(--s)*4));filter:brightness(.8)}
.left{transform:rotateY(-90deg) translateZ(calc(var(--s)*4));filter:brightness(.8)}
.top{transform:rotateX(90deg) translateZ(calc(var(--s)*6));filter:brightness(1.08)}
.bottom{transform:rotateX(-90deg) translateZ(calc(var(--s)*6));filter:brightness(.6)}
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);text-align:center;pointer-events:none}
#hud b{font-weight:600}
#hud span{display:block;opacity:.65;font-size:12px;margin-top:2px}
#bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 10px}
button{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:8px 13px;min-height:36px;cursor:pointer}
button:focus-visible{outline:2px solid var(--chip-on);outline-offset:2px}
button.on{background:var(--chip-on);color:#fff;border-color:transparent}
</style>
</head>
